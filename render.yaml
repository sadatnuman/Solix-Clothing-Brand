services:
  - type: web
    name: solix-backend
    runtime: node
    plan: free
    rootDir: solix-backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_PROVIDER
        value: cloudinary
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BKASH_NUMBER
        sync: false
      - key: NAGAD_NUMBER
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
